<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capítulo IX · El Oráculo</title><style>*{box-sizing:border-box}body{background:#080b1d;color:#f5e9d4;margin:0;font-family:system-ui}header{background:#151b30;padding:16px}a,button{display:inline-block;background:#25213c;border:1px solid #a98c57;color:#f5d38d;border-radius:10px;padding:12px;text-decoration:none;font:inherit;margin:5px}main{max-width:700px;margin:auto;padding:18px}img{width:100%;max-height:310px;object-fit:cover;border-radius:15px}h1,h2{color:#f5d38d;font-family:Georgia,serif}p{line-height:1.65;color:#d2ced9}.card{background:#151b30;border:1px solid #756344;padding:16px;border-radius:14px}.choices{display:grid;gap:8px}button{text-align:left}#status{color:#eac785}</style></head><body><header><a href="index.html">← Inicio</a> CAPÍTULO IX · SAGITARIO</header><main><img src="images/mapa_celeste.png" alt="Escenario astral"><h1>La flecha imposible</h1><p id="story"></p><div class="choices" id="choices"></div><p id="status" role="status"></p><section class="card"><h2>Diario astral</h2><p id="journal"></p><button id="restart">Releer historia</button></section></main><script>
const key="oraculo_capitulo_sagitario_v1",previous="escorpio",guardian="Kaus Australis",title="La flecha imposible";let state={step:0,clues:[],completed:false};try{state=Object.assign(state,JSON.parse(localStorage.getItem(key)||"{}"))}catch(e){}
const scenes=[{text:"Una flecha atraviesa el firmamento y apunta al lugar donde se esconde el noveno sello.",choices:[["Seguir el mapa celeste",1,"ruta_a"],["Preguntar a los viajeros",1,"ruta_b"]]},{text:"Una voz antigua murmura: «Kaus Australis conoce la señal». En la piedra hay una inscripción. La constelación que protege este sello es...",choices:[["Sagitario",2,"respuesta"],["Aries",1,"error"],["Géminis",1,"error"]]},{text:"El destino también se construye al elegir."+" El sello responde a tu decisión y la constelación recupera su luz.",choices:[["Restaurar el sello",3,"final"]]},{text:"El sello de Sagitario ha sido restaurado. Una nueva constelación te llama.",choices:[["Regresar al mapa astral",4,"home"],["Releer capítulo",0,"restart"]]}];
function save(){localStorage.setItem(key,JSON.stringify(state))}function choose(n,clue){if(clue==="home"){location.href="index.html";return}if(clue==="restart"){state.step=0;state.clues=[];save();render();return}if(clue==="error"){document.getElementById("status").textContent="El símbolo no responde. Observá el nombre del guardián.";return}if(clue&&!state.clues.includes(clue))state.clues.push(clue);if(n===3&&!state.completed){state.completed=true;try{let all=JSON.parse(localStorage.getItem("oraculo_guardianes_v1")||"{}"),id=localStorage.getItem("oraculo_guardian_actual")||"hamal_aries",d=all[id]||{xp:0,bond:0};d.xp=(d.xp||0)+60;d.bond=(d.bond||0)+3;all[id]=d;localStorage.setItem("oraculo_guardianes_v1",JSON.stringify(all))}catch(e){}}state.step=n;save();render()}
function render(){let s=scenes[state.step]||scenes[0],prev=JSON.parse(localStorage.getItem("oraculo_capitulo_"+previous+"_v1")||"{}");document.getElementById("story").textContent=s.text;let el=document.getElementById("choices");el.replaceChildren();if(!prev.completed){document.getElementById("status").textContent="Para acceder a este sello, completá primero el capítulo anterior.";return}document.getElementById("status").textContent=state.completed?"Sello restaurado · recompensa única registrada":"Sello por restaurar";document.getElementById("journal").textContent=state.clues.length?"Pistas: "+state.clues.join(" · "):"Aún no hay pistas.";s.choices.forEach(([label,n,clue])=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>choose(n,clue);el.appendChild(b)})}
document.getElementById("restart").onclick=()=>{state.step=0;state.clues=[];save();render()};render();</script></body></html>
