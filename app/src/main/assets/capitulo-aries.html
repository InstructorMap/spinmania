<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capítulo I · El Oráculo</title><style>*{box-sizing:border-box}body{margin:0;background:#070a1a;color:#f4e7cd;font-family:system-ui,sans-serif}header{padding:16px;background:#11172b;display:flex;justify-content:space-between;align-items:center}a,button{color:#f6d28c;background:#1c2039;border:1px solid #a88651;padding:11px 14px;border-radius:10px;text-decoration:none;font:inherit}main{max-width:700px;margin:auto;padding:16px}.scene{width:100%;max-height:320px;object-fit:cover;border-radius:15px;border:1px solid #987347}h1,h2{font-family:Georgia,serif;color:#f4d18a}p{line-height:1.65}.choices{display:grid;gap:10px;margin:18px 0}.choice{text-align:left}.journal{border:1px solid #705b46;border-radius:12px;padding:14px;background:#13162a}.note{color:#d0b87c;font-size:13px}.locked{opacity:.6}#status{min-height:24px;color:#f0ca84}</style></head><body><header><a href="index.html">← Inicio</a><strong>EL ORÁCULO · CAPÍTULO I</strong><a href="guardianes.html">Guardián</a></header><main><img class="scene" id="scene" src="images/capitulo_aries.png" alt="Templo astral bajo la luna"><h1 id="title"></h1><p id="story"></p><div class="choices" id="choices"></div><p id="status" role="status"></p><section class="journal"><h2>Diario de investigación</h2><p id="journal"></p><p class="note">Tus decisiones y pistas se conservan en este dispositivo. Historia de ficción inspirada en tradiciones mitológicas.</p><button id="restart">Reiniciar capítulo</button></section></main><script>

{title:"La noche en que desapareció Aries",img:"capitulo_aries.png",text:"A medianoche, la constelación de Aries se apaga. Una carta sellada con un ojo y doce radios aparece en tu habitación: «El primer sello ha sido robado. No confíes en quien conoce tu nombre». Tu Guardián siente una presencia detrás de la puerta.",choices:[["Abrir la carta y estudiar el sello",1,"sello"],["Escuchar a tu Guardián antes de avanzar",1,"eco"]]},
{title:"La biblioteca prohibida",img:"biblioteca_prohibida.png",text:"Entre los manuscritos hay dos versiones de una misma profecía. Una dice que el Vellocino protege el cielo; la otra, que lo mantiene prisionero. Un bibliotecario enmascarado pregunta qué buscás.",choices:[["Revelar que investigás el sello de Aries",2,"testimonio"],["Ocultar tu objetivo y examinar los códices",2,"codice"]]},
{title:"La cámara del primer sello",img:"camara_sellos.png",text:"Un círculo de doce símbolos gira sobre la puerta. Una inscripción advierte: «El primer fuego nace del carnero. El nombre del cielo abre el umbral». Debés identificar la constelación desaparecida.",choices:[["Aries",3,"respuesta"],["Escorpio",2,"error"],["Leo",2,"error"]]},
{title:"El precio de la verdad",img:"santuario_zodiacal.png",text:"La puerta se abre. Una sombra sostiene el sello robado y ofrece un pacto: revelar el nombre del traidor a cambio de abandonar el Vellocino. Tu Guardián espera tu decisión.",choices:[["Rechazar el pacto y proteger el sello",4,"proteccion"],["Aceptar la pista sin entregar el sello",4,"astucia"]]},
{title:"El primer despertar",img:"guerra_doce_sellos.png",text:"La sombra desaparece. El sello vuelve a brillar, pero ahora una segunda constelación comienza a oscurecerse. En la piedra aparece una palabra: «ALDEBARÁN». El misterio apenas comienza.",choices:[["Registrar el hallazgo y cerrar el capítulo",5,"final"]]},

];function persist(){localStorage.setItem(key,JSON.stringify(state))}function dailyAlignment(){try{let day=new Date(),k=day.getFullYear()+"-"+String(day.getMonth()+1).padStart(2,"0")+"-"+String(day.getDate()).padStart(2,"0");let all=JSON.parse(localStorage.getItem("oraculo_presagios_v1")||"{}");return Object.entries(all).find(([key,value])=>key.startsWith(k+"|"))?.[1]||null}catch(e){return null}}function select(next,clue){if(clue==="guardian"){location.href="guardianes.html";return}if(clue==="reinicio"){state={step:0,clues:[],choice:"",completed:false};persist();render();return}if(clue==="astucia"&&dailyAlignment()!=="Sabiduría"&&!state.clues.includes("codice")){$("status").textContent="Para negociar con astucia necesitás estudiar el códice o elegir Sabiduría en el Presagio Diario.";return}if(clue==="error"){$("status").textContent="El símbolo no responde. Volvé a examinar la inscripción.";return}if(clue&&!state.clues.includes(clue))state.clues.push(clue);if(clue==="proteccion"||clue==="astucia")state.choice=clue;if(next===5&&!state.completed){state.completed=true;try{let all=JSON.parse(localStorage.getItem(gkey)||"{}"),id=localStorage.getItem("oraculo_guardian_actual")||"hamal_aries";let d=all[id]||{xp:0,bond:0};d.xp=(d.xp||0)+60;d.bond=(d.bond||0)+3;all[id]=d;localStorage.setItem(gkey,JSON.stringify(all))}catch(e){}}state.step=next;persist();render()}function render(){let s=scenes[state.step]||scenes[0];let alignment=dailyAlignment();$("scene").src="images/"+s.img;$("title").textContent=s.title;$("story").textContent=s.text;$("status").textContent=alignment?"Afinidad diaria: "+alignment+" · "+(alignment==="Valor"?"tu coraje fortalece la defensa":alignment==="Sabiduría"?"podés descifrar negociaciones":"tu intuición descubre señales ocultas"):"Sin afinidad diaria: visitá el Presagio Diario.";if(alignment==="Intuición"&&state.step===1&&!state.clues.includes("eco")){state.clues.push("eco");persist()}$("journal").textContent=state.clues.length?"Pistas: "+state.clues.filter(x=>x!=="final").join(" · ")+(state.choice?". Decisión: "+(state.choice==="proteccion"?"proteger el sello":"investigar mediante astucia"):""):"Todavía no reuniste pistas.";$("choices").innerHTML="";s.choices.forEach(([label,n,c])=>{let b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>select(n,c);$("choices").appendChild(b)})}$("restart").onclick=()=>{if(confirm("¿Reiniciar la historia de Aries? La recompensa ya obtenida no se repetirá.")){state.step=0;state.clues=[];state.choice="";persist();render()}};render();</script></body></html>
