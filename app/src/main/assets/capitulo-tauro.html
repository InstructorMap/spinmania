<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capítulo II — El eco de Aldebarán · El Oráculo</title><style>body{margin:0;background:#080d20;color:#f4ead8;font-family:system-ui,sans-serif}header{padding:25px 18px;background:#111a34}main{max-width:720px;margin:auto;padding:16px}h1,h2{font-family:Georgia,serif;color:#f5d38d}img{width:100%;max-height:310px;object-fit:cover;border-radius:14px}button,a{display:inline-block;margin:6px 6px 6px 0;border:1px solid #b99555;border-radius:10px;background:#201c35;color:#f5d38d;padding:13px;text-decoration:none;font:inherit}p{line-height:1.6;color:#d4cede}.card{border:1px solid #7d6746;border-radius:14px;padding:16px;background:#131a32}#status{color:#f5d38d}</style></head><body><header><a href="index.html">← Oráculo</a><h1>Capítulo II — El eco de Aldebarán</h1></header><main><img src="images/observatorio_estelar.png" alt="Escenario de la campaña"><section class="card"><h2 id="heading"></h2><p id="story"></p><div id="choices"></div><p id="status" role="status"></p></section></main><script>const key="oraculo_capitulo_tauro_v1",next="capitulo-geminis.html",steps=[["El observatorio vacío","Aldebarán dejó una señal entre los mapas estelares. La Orden de la Luz Negra busca el segundo sello.",["Examinar el mapa","Interrogar al astrónomo"]],["La órbita alterada","Dos constelaciones aparecen superpuestas. Solo una conduce al santuario.",["Seguir la constelación de Tauro","Seguir el reflejo de Escorpio"]],["La prueba de la Tierra","El segundo sello descansa bajo una cámara de piedra. Una voz exige una decisión.",["Proteger a los testigos","Tomar el sello y escapar"]],["El segundo sello","La cámara vuelve a brillar. En la pared aparece un nombre: Pólux.",["Registrar la victoria"]]];let state={step:0,decisions:[],completed:false};try{state=Object.assign(state,JSON.parse(localStorage.getItem(key)||"{}"))}catch(e){}const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(state))}function choose(i){if(state.completed){location.href=next;return}state.decisions.push(i);state.step++;if(state.step>=steps.length){state.completed=true;let all={};try{all=JSON.parse(localStorage.getItem("oraculo_guardianes_v1")||"{}")}catch(e){}let id=localStorage.getItem("oraculo_guardian_actual")||"hamal_aries";let g=all[id]||{xp:0,bond:0};g.xp=(g.xp||0)+75;g.bond=(g.bond||0)+3;all[id]=g;localStorage.setItem("oraculo_guardianes_v1",JSON.stringify(all))}save();render()}function render(){let done=state.completed,scene=done?["Sello restaurado","El sello vuelve a brillar. Tu decisión queda registrada.",["Continuar"]]:steps[state.step];$("heading").textContent=scene[0];$("story").textContent=scene[1];$("choices").innerHTML="";scene[2].forEach((label,i)=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>choose(i);$("choices").appendChild(b)});$("status").textContent=done?"Capítulo completado · recompensa registrada una sola vez":"Escena "+(state.step+1)+" de "+steps.length}render()</script></body></html>
