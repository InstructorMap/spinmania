<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d20"><title>Misiones y logros · El Oráculo</title><style>*{box-sizing:border-box}body{margin:0;background:#080c1c;color:#f8e8cf;font-family:system-ui,sans-serif}header{padding:35px 18px;background:linear-gradient(#090d20aa,#090d20),url('images/observatorio_estelar.png') center/cover}main{max-width:720px;margin:auto;padding:16px}h1,h2{font-family:Georgia,serif;color:#f4d18a}p{color:#c9c4d2;line-height:1.5}a,button{display:inline-block;border:1px solid #b49461;border-radius:10px;padding:12px;background:#242038;color:#f5d58e;text-decoration:none;font:inherit}button:disabled{opacity:.5}.card{background:#151b32;border:1px solid #705b41;border-radius:14px;padding:15px;margin:12px 0}.done{color:#83d6ac}.meta{font-size:13px}#message{min-height:24px;color:#f5d58e}</style></head><body><header><a href="index.html">← Volver al Oráculo</a><h1>Misiones del destino</h1><p>Rituales diarios, logros y recompensas astrales. Sin compras ni apuestas.</p></header><main><h2>Desafíos diarios</h2><div id="daily"></div><h2>Logros de campaña</h2><div id="achievements"></div><p id="message" role="status"></p><p class="meta">Las misiones se calculan con tu progreso local. Las recompensas diarias se entregan una sola vez por día.</p></main><script>
const $=x=>document.getElementById(x),today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")},read=(k,f={})=>{try{return JSON.parse(localStorage.getItem(k)||"null")||f}catch(e){return f}},id=()=>localStorage.getItem("oraculo_guardian_actual")||"hamal_aries";
function grant(xp,bond){let all=read("oraculo_guardianes_v1"),g=all[id()]||{xp:0,bond:0};g.xp=(g.xp||0)+xp;g.bond=(g.bond||0)+bond;all[id()]=g;localStorage.setItem("oraculo_guardianes_v1",JSON.stringify(all))}
function item(title,description,ready,claimed,onClaim){let c=document.createElement("section");c.className="card";let h=document.createElement("h3");h.textContent=title;let p=document.createElement("p");p.textContent=description;let b=document.createElement("button");b.textContent=claimed?"✓ Reclamada":ready?"Reclamar recompensa":"Pendiente";b.disabled=!ready||claimed;if(onClaim)b.onclick=onClaim;c.append(h,p,b);return c}
function render(){let day=today(),daily=$("daily");daily.replaceChildren();let pres=read("oraculo_presagios_v1"),hasPres=Object.keys(pres).some(k=>k.startsWith(day+"|"));let wins=Object.keys(localStorage).filter(k=>k.startsWith("oraculo_victoria_")&&localStorage.getItem(k)===day).length;let bonds=Object.keys(localStorage).filter(k=>k.startsWith("oraculo_vinculo_")&&localStorage.getItem(k)===day).length;
let missions=[["presagio","Consultar el Presagio","Elegí tu afinidad astral en el Presagio Diario.",hasPres],["vinculo","Fortalecer un vínculo","Fortalecé el vínculo de cualquier Guardián.",bonds>0],["victoria","Vencer a una sombra","Ganale un combate a una sombra astral.",wins>0]];
missions.forEach(([k,title,desc,ready])=>{let claimKey="oraculo_mision_"+day+"_"+k,claimed=localStorage.getItem(claimKey)==="1";daily.appendChild(item(title,desc+" · +15 XP y +1 vínculo",ready,claimed,()=>{if(localStorage.getItem(claimKey)==="1")return;try{localStorage.setItem(claimKey,"1");grant(15,1);$("message").textContent="Recompensa recibida: +15 XP y +1 vínculo";render()}catch(e){localStorage.removeItem(claimKey);$("message").textContent="No se pudo guardar la recompensa"}}))});
let achievements=$("achievements");achievements.replaceChildren();let all=read("oraculo_guardianes_v1"),chapters=["aries","tauro","geminis","cancer","leo","virgo","libra","escorpio","sagitario","capricornio","acuario","piscis"].filter(x=>read("oraculo_capitulo_"+x+"_v1").completed).length,inv=read("oraculo_inventario_v1"),checks=[["Primer sello","Completá el capítulo de Aries.",chapters>=1],["Investigador astral","Completá los tres primeros capítulos.",chapters>=3],["Maestro de los sellos","Restaurá los doce sellos zodiacales.",chapters>=12],["Medio cielo","Restaurá seis sellos zodiacales.",chapters>=6],["Coleccionista","Restaurá el Amuleto del Primer Sello.",!!inv.amuleto],["Vínculo celestial","Alcanzá 10 puntos de vínculo con un Guardián.",Object.values(all).some(x=>(x.bond||0)>=10)],["Primer despertar","Alcanzá el nivel 11 con un Guardián.",Object.values(all).some(x=>(x.xp||0)>=400)]];
checks.forEach(([title,desc,done])=>achievements.appendChild(item(title,desc,done,done,null)))}
render();</script></body></html>
