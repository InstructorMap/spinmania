<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presagio diario · El Oráculo</title><style>*{box-sizing:border-box}body{margin:0;background:#070a1b;color:#f4e5c8;font-family:system-ui,sans-serif}main{max-width:660px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#12172b}a,button,select{background:#1b2038;border:1px solid #b18a4e;color:#f4d28c;border-radius:11px;padding:12px;font:inherit;text-decoration:none}button{cursor:pointer}h1,h2{font-family:Georgia,serif;color:#f3d08a}h1{text-align:center}p{line-height:1.6}.card{border:1px solid #ab8550;border-radius:18px;background:linear-gradient(#0c1024cc,#080b1ee8),url('images/rueda_zodiacal.png') center/cover;padding:22px;margin:16px 0;text-align:center;box-shadow:0 12px 35px #0007}.card .quote{font:italic 24px/1.5 Georgia,serif;color:#ffe1a2}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choices button{padding:11px 4px;font-size:13px}.selected{background:#6b4d30}#cardCanvas{width:100%;border-radius:12px;border:1px solid #b18a4e}#status{color:#eac887;min-height:25px}small{color:#b9b3c7}</style></head><body><header><a href="index.html">← Inicio</a><strong>EL ORÁCULO</strong><a href="guardianes.html">Guardián</a></header><main><h1>☾ El Presagio Diario ☽</h1><p>Una señal para cada signo. Una decisión que deja huella.</p><label for="sign">Tu signo zodiacal</label><select id="sign"></select><section class="card"><small id="date"></small><h2 id="heading"></h2><p class="quote" id="quote"></p><p id="horoscope"></p><p id="guardian"></p></section><h2>¿Cómo responderás al destino?</h2><div class="choices" id="choices"></div><p id="status" role="status"></p><h2>Tu tarjeta para compartir</h2><canvas id="cardCanvas" width="900" height="1200" aria-label="Tarjeta de horóscopo"></canvas><p><button id="share">Compartir imagen</button> <button id="download">Guardar PNG</button> <button id="copy">Copiar texto</button></p><small>Los presagios son relatos simbólicos de ficción y entretenimiento. No son predicciones reales.</small></main><script>
const signs=[["Aries","♈","Hamal"],["Tauro","♉","Aldebarán"],["Géminis","♊","Pólux"],["Cáncer","♋","Acubens"],["Leo","♌","Regulus"],["Virgo","♍","Spica"],["Libra","♎","Zubenelgenubi"],["Escorpio","♏","Antares"],["Sagitario","♐","Kaus Australis"],["Capricornio","♑","Deneb Algedi"],["Acuario","♒","Sadalsuud"],["Piscis","♓","Alrescha"]];
const quotes=["Una puerta cerrada puede proteger un secreto, no impedir un camino.","Las estrellas no dictan tus pasos; iluminan tus elecciones.","El silencio de una constelación también contiene una respuesta.","La valentía no es ausencia de miedo, sino voluntad de comprenderlo.","El destino cambia cuando alguien se atreve a preguntar.","A veces, la sombra revela aquello que la luz oculta.","El verdadero poder comienza al reconocer tus límites.","No toda señal exige actuar; algunas invitan a observar.","Las antiguas promesas sobreviven a quienes las pronunciaron.","La llave más difícil de encontrar es la que llevás dentro.","Ningún cielo permanece inmóvil para quien sabe mirar.","Lo desconocido no siempre es enemigo: puede ser el comienzo."];
const messages=["Hoy un detalle olvidado podría darte una nueva perspectiva. Investigá antes de decidir.","Una conversación puede abrir un camino inesperado. Escuchá tanto como hablás.","Tu Guardián percibe un cambio sutil. Conservá la calma y observá las señales.","Una elección pequeña puede tener un significado importante en tu historia.","La paciencia te ayudará a distinguir una pista auténtica de una ilusión.","La memoria guarda respuestas que el ruido del presente puede ocultar.","Tu intuición merece ser escuchada, pero contrastá las pistas con hechos.","No necesitás resolver todos los misterios hoy. Elegí el próximo paso.","Una alianza puede fortalecerse si compartís lo que aprendiste.","La claridad aparece cuando ordenás los fragmentos de una historia.","El coraje también consiste en pedir ayuda a tu compañero astral.","Hay belleza en los caminos que todavía no conocés."];
const $=id=>document.getElementById(id);const localDate=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};let day=localDate();let saved={};try{saved=JSON.parse(localStorage.getItem("oraculo_presagios_v1")||"{}")||{}}catch(e){}let sign=localStorage.getItem("oraculo_signo_presagio")||"Aries";function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}function data(){let i=signs.findIndex(x=>x[0]===sign),n=hash(day+"-"+sign);return {i,n,quote:quotes[(n+i)%quotes.length],message:messages[(Math.floor(n/17)+i)%messages.length],guardian:signs[i][2],symbol:signs[i][1]}}function wrap(ctx,text,x,y,max,line){let words=text.split(" "),s="";for(let w of words){let next=s?s+" "+w:w;if(ctx.measureText(next).width>max&&s){ctx.fillText(s,x,y);y+=line;s=w}else s=next}if(s)ctx.fillText(s,x,y);return y+line}function card(){let c=$("cardCanvas"),ctx=c.getContext("2d"),d=data();let g=ctx.createLinearGradient(0,0,900,1200);g.addColorStop(0,"#151b41");g.addColorStop(1,"#060817");ctx.fillStyle=g;ctx.fillRect(0,0,900,1200);ctx.strokeStyle="#c99d5b";ctx.lineWidth=8;ctx.strokeRect(32,32,836,1136);ctx.textAlign="center";ctx.fillStyle="#f6d899";ctx.font="bold 58px Georgia";ctx.fillText("EL ORÁCULO",450,125);ctx.font="28px Georgia";ctx.fillText("LOS 12 SECRETOS DEL ZODÍACO",450,176);ctx.font="160px Georgia";ctx.fillText(d.symbol,450,370);ctx.font="bold 66px Georgia";ctx.fillText(sign.toUpperCase(),450,460);ctx.font="32px Georgia";ctx.fillText(day,450,520);ctx.font="italic 43px Georgia";let y=wrap(ctx,d.quote,450,620,720,59);ctx.font="31px Georgia";ctx.fillStyle="#f3e6d1";y=wrap(ctx,d.message,450,y+65,720,47);ctx.fillStyle="#d7b978";ctx.font="30px Georgia";ctx.fillText("Guardián: "+d.guardian,450,1050);ctx.font="24px Georgia";ctx.fillText("Una historia para compartir · Ficción",450,1120)}function textShare(){let d=data();return "☾ EL ORÁCULO · "+sign+" · "+day+"\n“"+d.quote+"”\n"+d.message+"\nGuardián: "+d.guardian+"\n#ElOraculo #Zodiaco"}function render(){let d=data();$("date").textContent=day;$("heading").textContent=d.symbol+" "+sign;$("quote").textContent="“"+d.quote+"”";$("horoscope").textContent=d.message;$("guardian").textContent="✧ "+d.guardian+" te acompaña hoy.";$("choices").innerHTML="";let choice=saved[day+"|"+sign];["Valor","Sabiduría","Intuición"].forEach(c=>{let b=document.createElement("button");b.textContent=c;if(choice===c)b.classList.add("selected");b.onclick=()=>{saved[day+"|"+sign]=c;localStorage.setItem("oraculo_presagios_v1",JSON.stringify(saved));render();$("status").textContent="Tu elección quedó registrada: "+c};$("choices").appendChild(b)});$("status").textContent=choice?"Decisión de hoy: "+choice:"Elegí una respuesta para registrar tu presagio.";card()}signs.forEach(x=>{let o=document.createElement("option");o.value=x[0];o.textContent=x[1]+" "+x[0];$("sign").appendChild(o)});$("sign").value=sign;$("sign").onchange=e=>{sign=e.target.value;localStorage.setItem("oraculo_signo_presagio",sign);render()};function saveImage(){let a=document.createElement("a");a.download="oraculo-"+sign.toLowerCase()+"-"+day+".png";a.href=$("cardCanvas").toDataURL("image/png");a.click()}$("download").onclick=saveImage;$("copy").onclick=()=>{let t=textShare();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>$("status").textContent="Texto copiado").catch(()=>$("status").textContent=t);else $("status").textContent=t};$("share").onclick=()=>{let c=$("cardCanvas");c.toBlob(async blob=>{if(!blob){saveImage();return}let file=new File([blob],"presagio-"+day+".png",{type:"image/png"});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"El Oráculo",text:textShare()});return}if(navigator.share){await navigator.share({title:"El Oráculo",text:textShare()});return}saveImage();$("status").textContent="Tarjeta guardada: compartila desde tu galería."}catch(e){if(e.name!=="AbortError"){$("status").textContent="No se pudo compartir. Usá Guardar PNG."}}},"image/png")};render();document.addEventListener("visibilitychange",()=>{if(!document.hidden&&day!==localDate()){day=localDate();render()}});</script></body></html>
