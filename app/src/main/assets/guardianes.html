<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardianes Astrales · El Oráculo</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b1d;color:#f5e8d0;font-family:system-ui,sans-serif}header{padding:24px 18px;text-align:center;background:linear-gradient(#0a0c20aa,#080b1df0),url('images/guerra_doce_sellos.png') center/cover}h1{font:32px Georgia,serif;color:#f4d48b;margin:10px 0}h2{font:23px Georgia,serif;color:#f4d48b}p{color:#c4c3d2}main{max-width:780px;margin:auto;padding:18px}button,a{border:1px solid #a9854e;background:#211b31;color:#f5d28a;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}a{display:inline-block;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid button{padding:5px;min-width:0;font-size:11px}.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}.card{border:1px solid #725b42;background:#13152c;border-radius:16px;padding:14px;margin:16px 0}.hero{width:100%;max-height:420px;object-fit:contain;background:#050917;border-radius:12px}.actions{display:flex;flex-wrap:wrap;gap:8px}.meter{height:12px;background:#292943;border-radius:8px;overflow:hidden}.meter>div{height:100%;background:linear-gradient(90deg,#7e61cb,#f6c46d);width:0}.small{font-size:13px}.notice{color:#f4d48b;min-height:24px}button:disabled{opacity:.45}strong{color:#f4d48b}</style></head><body><header><a href="index.html">← Volver al Oráculo</a><h1>Guardianes Astrales</h1><p>Elegí tu estrella. Entrená su vínculo. Despertá su poder.</p></header><main><h2>Las doce estrellas</h2><div class="grid" id="grid"></div><section class="card" id="detail"><h2 id="name"></h2><img id="art" class="hero" alt="Evolución del Guardián"><p id="info"></p><div class="meter"><div id="progress"></div></div><p id="xp" class="small"></p><div class="actions"><button id="train">Entrenar percepción</button><button id="bond">Fortalecer vínculo</button><button id="challenge">Resolver enigma</button></div><p id="notice" class="notice" role="status"></p><p class="small">Las actividades conceden experiencia y desbloquean nuevas formas. El progreso se guarda en este dispositivo.</p></section></main><script>const guardians=[["hamal_aries","Hamal","Aries","Fuego"],["aldebaran_tauro","Aldebarán","Tauro","Tierra"],["pollux_geminis","Pólux","Géminis","Ilusión"],["acubens_cancer","Acubens","Cáncer","Agua"],["regulus_leo","Regulus","Leo","Luz"],["spica_virgo","Spica","Virgo","Sanación"],["zubenelgenubi_libra","Zubenelgenubi","Libra","Equilibrio"],["antares_escorpio","Antares","Escorpio","Sombras"],["kaus_australis_sagitario","Kaus Australis","Sagitario","Viento"],["deneb_algedi_capricornio","Deneb Algedi","Capricornio","Hielo"],["sadalsuud_acuario","Sadalsuud","Acuario","Tormenta"],["alrescha_piscis","Alrescha","Piscis","Sueños"]];const key="oraculo_guardianes_v1";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}let selected=localStorage.getItem("oraculo_guardian_actual")||guardians[0][0];const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(state));localStorage.setItem("oraculo_guardian_actual",selected)}function level(x){return 1+Math.floor(x/40)}function stage(l){return l>=31?3:l>=11?2:1}function render(){let g=guardians.find(x=>x[0]===selected)||guardians[0],d=state[selected]||{xp:0,bond:0};let l=level(d.xp),st=stage(l),suf=["","01_cria","02_joven","03_guardian_estelar"][st];$('name').textContent=g[1]+" · "+g[2];$('art').src="images/"+g[0]+"_"+suf+".png";$('info').textContent="Afinidad: "+g[3]+" · Nivel "+l+" · "+["","Cría","Joven","Guardián Estelar"][st]+" · Vínculo "+d.bond;$('xp').textContent="Experiencia: "+d.xp+" · Próximo nivel: "+(l*40)+" XP";$('progress').style.width=(d.xp%40)/40*100+"%";$('grid').innerHTML="";guardians.forEach(x=>{let b=document.createElement("button");b.innerHTML='<img alt="" src="images/'+x[0]+'_01_cria.png"><span>'+x[1]+'</span>';b.setAttribute("aria-label","Elegir "+x[1]);b.onclick=()=>{selected=x[0];save();$('notice').textContent="";render()};$('grid').appendChild(b)})}function reward(amount,bond,msg){let d=state[selected]||{xp:0,bond:0};d.xp+=amount;d.bond+=bond;state[selected]=d;save();render();$('notice').textContent=msg+" · +"+amount+" XP"}$('train').onclick=()=>{let q=Math.floor(Math.random()*5)+3;let ans=prompt("Entrenamiento de percepción: ¿cuánto es "+q+" + "+(q+2)+"?");if(ans===null)return;if(Number(ans)===2*q+2)reward(15,1,"Entrenamiento superado");else $('notice').textContent="Respuesta incorrecta. Podés intentarlo de nuevo."};$('bond').onclick=()=>reward(5,2,"El vínculo astral se fortalece");$('challenge').onclick=()=>{let a=prompt("Enigma del Oráculo: tengo doce casas y ningún techo. ¿Qué soy? (zodíaco)");if(a===null)return;if(/zod[ií]aco/i.test(a))reward(25,1,"Sello descifrado");else $('notice').textContent="El códice permanece cerrado. Investigá otra vez."};render();</script></body></html>
