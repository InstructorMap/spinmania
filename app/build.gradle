plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spinmania.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spinmania.game'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '1.5.0-rc1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
