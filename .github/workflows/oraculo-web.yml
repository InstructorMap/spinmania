name: Publicar El Oráculo RPG Web
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - '.github/workflows/oraculo-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: oraculo-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare RPG site
        run: |
          mkdir -p public
          cp -R app/src/main/assets/. public/
          cat > public/.nojekyll <<'EOF'
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
